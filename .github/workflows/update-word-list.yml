# Daily word-list generator.
name: Update word list

on:
  schedule:
    # ~06:15 UTC daily. GitHub may delay scheduled runs during high load,
    # so treat this as "roughly once a day".
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write         # let the built-in token push the commit

# Avoid overlapping runs if a scheduled and manual run coincide.
concurrency:
  group: update-word-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wordle-words
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Generate word list
        # `uvx --from <source> <command>` is the npx-equivalent: fetch the
        # package into a throwaway env and run its CLI. Pin a tag/ref after the
        # URL (e.g. @v0.1.0) once you cut releases of wordontwords.
        run: |
          uvx --from git+https://github.com/eacaps/wordontwords \
            wordontwords --output dist/word-list.json

      - name: Commit word list if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dist/word-list.json; then
            echo "No changes to dist/word-list.json; nothing to commit."
          else
            git add dist/word-list.json
            git commit -m "chore: update word list ($(date -u +%Y-%m-%d))"
            git push
          fi
